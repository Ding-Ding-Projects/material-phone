name: Windows build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      workflow-started: ${{ steps.timing.outputs.started }}
    env:
      MATERIAL_PHONE_VERSION: 0.0.${{ github.run_number }}.${{ github.run_attempt }}
      SILENT: 1
    steps:
      - name: Record workflow start
        id: timing
        shell: pwsh
        run: |
          $started = (Get-Date).ToUniversalTime().ToString('o')
          "started=$started" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force -Path build/evidence | Out-Null
          Set-Content -LiteralPath build/evidence/workflow-started.txt -Value $started -Encoding ascii

      - name: Check out source without private gitlinks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Bootstrap declared build dependencies
        shell: cmd
        run: download-dependencies.bat /s

      - name: Build application payload
        shell: cmd
        run: build.bat /s

      - name: Build unsigned Squirrel.Windows installer
        shell: cmd
        run: build-installer.bat /s

      - name: Count project lines at this commit
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/count-lines.ps1 -WithAttribution -OutputPath build/evidence/line-count.md

      - name: Collect safe build evidence
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/evidence | Out-Null
          @(
            "run_id=$env:GITHUB_RUN_ID",
            "run_attempt=$env:GITHUB_RUN_ATTEMPT",
            "commit=$env:GITHUB_SHA",
            "job_status=${{ job.status }}",
            "runner_os=$env:RUNNER_OS",
            "runner_arch=$env:RUNNER_ARCH"
          ) | Set-Content -LiteralPath build/evidence/run-context.txt -Encoding utf8

      - name: Upload publication bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-publication-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 3
          path: |
            build/evidence/line-count.md
            build/release/**/Setup.exe
            build/release/**/RELEASES
            build/release/**/*-full.nupkg
            build/release/**/*-delta.nupkg
            build/release/**/payload-provenance.json
            build/release/**/build-provenance.json

      - name: Upload safe failure evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/evidence/**
            build/release/**/Setup.exe
            build/release/**/RELEASES
            build/release/**/*-full.nupkg
            build/release/**/*-delta.nupkg
            build/release/**/payload-provenance.json
            build/release/**/build-provenance.json

  publish:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified publication bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-bundle

      - name: Publish unique development release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: dev-${{ github.run_id }}-${{ github.run_attempt }}
          MATERIAL_PHONE_VERSION: 0.0.${{ github.run_number }}.${{ github.run_attempt }}
          WORKFLOW_STARTED: ${{ needs.build.outputs.workflow-started }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path -LiteralPath 'publication-bundle').Path
          $provenanceFiles = @(Get-ChildItem -LiteralPath $bundle -Filter 'build-provenance.json' -File -Recurse)
          if ($provenanceFiles.Count -ne 1) { throw "Expected one build provenance file, found $($provenanceFiles.Count)." }
          $releaseDir = $provenanceFiles[0].Directory.FullName
          $provenance = Get-Content -Raw -LiteralPath $provenanceFiles[0].FullName | ConvertFrom-Json
          if ([string]$provenance.commit -ne $env:GITHUB_SHA -or -not [bool]$provenance.unsigned) { throw 'Downloaded provenance does not bind to this unsigned source commit.' }
          foreach ($record in @($provenance.artifacts)) {
            $path = Join-Path $releaseDir ([string]$record.name)
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Provenance artifact missing: $($record.name)" }
            $item = Get-Item -LiteralPath $path
            if ($item.Length -ne [int64]$record.size) { throw "Provenance size mismatch: $($record.name)" }
            $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($sha256 -ne ([string]$record.sha256).ToLowerInvariant()) { throw "Provenance SHA-256 mismatch: $($record.name)" }
          }
          $setup = Join-Path $releaseDir 'Setup.exe'
          if ([string](Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'NotSigned') { throw 'Setup.exe is not unsigned.' }
          $fullPackages = @(Get-ChildItem -LiteralPath $releaseDir -Filter '*-full.nupkg' -File)
          if ($fullPackages.Count -eq 0) { throw 'No full Squirrel package was downloaded.' }
          $deltaPackages = @(Get-ChildItem -LiteralPath $releaseDir -Filter '*-delta.nupkg' -File)
          $lineCountFiles = @(Get-ChildItem -LiteralPath $bundle -Filter 'line-count.md' -File -Recurse)
          if ($lineCountFiles.Count -ne 1) { throw "Expected one line-count file, found $($lineCountFiles.Count)." }
          $lineCount = Get-Content -Raw -LiteralPath $lineCountFiles[0].FullName
          $notesPath = Join-Path $bundle 'release-notes.md'
          $initialNotes = @(
            '# Windows development build',
            '',
            "Commit: ``$env:GITHUB_SHA``",
            "Version: ``$env:MATERIAL_PHONE_VERSION``",
            'Installer: unsigned Squirrel.Windows artifacts. Windows may show an unknown-publisher warning.',
            'Local tests and lint were not run by this build-and-release workflow.',
            "Delta packages: $($deltaPackages.Count) (generated only when a compatible prior full package is available).",
            '',
            '## Workflow timing',
            '',
            "Workflow started: $env:WORKFLOW_STARTED",
            'Workflow completed: pending final publication measurement',
            'Workflow duration: pending final publication measurement',
            '',
            $lineCount
          ) -join "`n"
          Set-Content -LiteralPath $notesPath -Value $initialNotes -Encoding utf8
          $assets = @($setup, (Join-Path $releaseDir 'RELEASES'), (Join-Path $releaseDir 'payload-provenance.json'), $provenanceFiles[0].FullName, $lineCountFiles[0].FullName) + @($fullPackages.FullName) + @($deltaPackages.FullName)
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "Development build $env:MATERIAL_PHONE_VERSION" --notes-file $notesPath --latest=false
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed (exit $LASTEXITCODE)." }
          $completed = (Get-Date).ToUniversalTime()
          $start = [DateTimeOffset]::Parse($env:WORKFLOW_STARTED).UtcDateTime
          $duration = $completed - $start
          $durationText = '{0:00}:{1:00}:{2:00}' -f [Math]::Floor($duration.TotalHours), $duration.Minutes, $duration.Seconds
          $finalNotes = $initialNotes.Replace('Workflow completed: pending final publication measurement', "Workflow completed: $($completed.ToString('o'))").Replace('Workflow duration: pending final publication measurement', "Workflow duration: $durationText")
          Set-Content -LiteralPath $notesPath -Value $finalNotes -Encoding utf8
          gh release edit $env:RELEASE_TAG --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "Release timing update failed (exit $LASTEXITCODE)." }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
